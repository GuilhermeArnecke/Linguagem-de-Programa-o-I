<!DOCTYPE html>
<html lang="PT-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon</title>
</head>
<body style="background-color: gainsboro; display: flex; flex-direction: column;
  align-items: center; margin: 0;">

  <label for="nomePokemon" style="margin-top: 50px; font-family: sans-serif; 
    font-size: xx-large; padding: 10px;"><Strong>Pokémon</Strong></label>

  <input id="nomePokemon" style="border-radius: 50px; width: 500px; 
    height: 30px; font-size: x-large; text-align: center;
    font-family: Arial, Helvetica, sans-serif; margin-top: 10px; 
    margin-bottom: 10px;" type="text">

  <button id="submit" style="border-radius: 15px; margin: 10px;" 
    type="submit"><strong>Procurar</strong></button>

  <div id="caixa" style="border: 10px blue solid; width: 500px; height: 300px;
    display: flex; justify-content: center; align-items: center; 
    border-radius: 20px; margin: 10px;">
    <img id="imagemPokemon" style="height: 280px;" 
      src="https://play-lh.googleusercontent.com/yRXBGhjSSQE_LKt2NJMsU2HjyJ5al6Gf8W0vIKUF_zWa1QPO14QUXli7hPP9u3koSXQVOI2_SsqmbTF09D6pAJo" 
      alt="Pokémon" style="display: block;">
  </div>
  
</body>
</html>

<script>
    const nome = document.querySelector('#nomePokemon')
    const imagem = document.querySelector('#imagemPokemon')
    const botao = document.querySelector('#submit')

    async function BuscarPokemon() {
      const BASE_URL = "https://pokeapi.co/api/v2/pokemon/"
      const busca = nome.value.toLowerCase().trim()

      const url = BASE_URL + busca

      const response = await fetch(url)
      const pokemons = await response.json()

      const urlImagem = pokemons.sprites.front_default
      console.log(urlImagem)
      
      imagem.src = urlImagem
    }

    botao.addEventListener('click', (event) => {
      event.preventDefault()
      BuscarPokemon()
    })
  </script>

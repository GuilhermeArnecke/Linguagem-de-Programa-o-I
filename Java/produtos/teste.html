<html>
    <head>
        <title>Cadastro de Produtos</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="container">
            <h2>Cadastro de Produtos</h2>
            <form id="produtosForm"> 
                <input type="number" id="id" placeholder="ID" required><br><br> 
                <input type="text" id="nome" placeholder="Nome" required><br><br>  
                <input type="number" id="preco" placeholder="Preço" required><br><br>

                <button type="submit">Cadastrar Produtos</button>

            </form>
            <div id="mensagem" class="status"></div>

            <hr> 
            <h2>Produtos Cadastros</h2>
            <table id="tabelaProdutos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Preço</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Os produtos aparecerao aqui -->
                </tbody>
            </table>
        </div>
        <script>
            const form = document.getElementById('produtosForm');
            const msgDiv = document.getElementById('mensagem');
            const tabelaCorpo = document.querySelector('#tabelaProdutos tbody');
            const API_URL = 'http://localhost:8080/produtos';
            async function carregarProdutos(){
            try{
            const response = await fetch(API_URL);
            const produtos = await response.json();
            tabelaCorpo.innerHTML = '';
            produtos.forEach(p => {
            const linha = `<tr>
                    <td>${p.id}</td>
                    <td>${p.nome}</td>
                    <td>R$ ${parseFloat(p.preco).toFixed(2)}</td>
                    </tr>`;
            tabelaCorpo.innerHTML += linha;
            });
            } catch (error){
                console.error("Erro ao buscar o produtos:", error);
            }
            }
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const produto = {
                    id: document.getElementById('id').value,
                    nome: document.getElementById('nome').value,
                    preco: document.getElementById('preco').value
                };
                try{
                    const response = await fetch(API_URL,{
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(produto)
                    });
                    if(response.ok){
                        msgDiv.innerText = "Sucesso!";
                        msgDiv.style.color = "green";
                        form.reset();
                        carregarProdutos();
                    }else{
                        msgDiv.innerText = "Erro no cadastro.";
                        msgDiv.style.color = "red";
                    }
                }catch(error){
                    msgDiv.innerText = "Erro: API offline.";
                    msgDiv.style.color = "red";
                }
            });
            carregarProdutos();
        </script>
    </body>
</html>
